<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f1e8">
  <title>Cahier de rédaction</title>
  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbf8f1'/%3E%3Cpath d='M10 3v26' stroke='%23b5382a' stroke-width='2'/%3E%3Cpath d='M15 11h11M15 16h11M15 21h7' stroke='%2326231d' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/fonts/KaTeX_Size3-Regular.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/fonts/KaTeX_Size4-Regular.woff2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">Cahier de rédaction</a>
    <nav class="domains" aria-label="Rubriques">
      <a href="#/algebre" data-d="algebre">Algèbre</a>
      <a href="#/analyse" data-d="analyse">Analyse</a>
      <a href="#/probabilites" data-d="probabilites">Probabilités</a>
      <span class="curseur" aria-hidden="true"></span>
    </nav>
    <label class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher un modèle" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <button class="theme" type="button" aria-label="Thème : automatique" title="Thème : automatique">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <g class="i-auto"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" class="plein"/></g>
        <g class="i-clair"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10h2.2M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6"/></g>
        <g class="i-sombre"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z"/></g>
      </svg>
    </button>
  </header>
  <main id="view"></main>
  <button class="quitter-lecture" type="button">Quitter la lecture <kbd>Échap</kbd></button>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="data/modeles.js"></script>
  <script defer src="app.js?v=5"></script>
</body>
</html>
